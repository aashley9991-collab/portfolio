<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Horizon Grid sample artwork">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9f6f0"/>
      <stop offset="0.5" stop-color="#ece6da"/>
      <stop offset="1" stop-color="#d9d2c4"/>
    </linearGradient>
    <linearGradient id="hz5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f4ac7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2f4ac7" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#2f4ac7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow5" cx="50%" cy="48%" r="46%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg5)"/>
  <rect width="1600" height="1000" fill="url(#glow5)"/>

  <!-- skyline masses -->
  <g fill="#1b1d22" fill-opacity="0.08">
    <rect x="180" y="330" width="90" height="170"/>
    <rect x="300" y="390" width="60" height="110"/>
    <rect x="470" y="300" width="110" height="200"/>
    <rect x="700" y="360" width="70" height="140"/>
    <rect x="860" y="280" width="130" height="220"/>
    <rect x="1120" y="350" width="80" height="150"/>
    <rect x="1290" y="310" width="120" height="190"/>
  </g>
  <g stroke="#1b1d22" stroke-opacity="0.26" stroke-width="1.4" fill="none">
    <rect x="180" y="330" width="90" height="170"/>
    <rect x="470" y="300" width="110" height="200"/>
    <rect x="860" y="280" width="130" height="220"/>
    <rect x="1290" y="310" width="120" height="190"/>
  </g>

  <line x1="0" y1="500" x2="1600" y2="500" stroke="url(#hz5)" stroke-width="3"/>

  <!-- floor grid -->
  <g stroke="#2f4ac7" stroke-opacity="0.34" stroke-width="1.4">
    <path d="M800 500 L-140 1000"/><path d="M800 500 L120 1000"/>
    <path d="M800 500 L380 1000"/><path d="M800 500 L620 1000"/>
    <path d="M800 500 L800 1000"/><path d="M800 500 L980 1000"/>
    <path d="M800 500 L1220 1000"/><path d="M800 500 L1480 1000"/>
    <path d="M800 500 L1740 1000"/>
  </g>
  <g stroke="#2f4ac7" stroke-opacity="0.2" stroke-width="1.1">
    <path d="M0 560 H1600"/><path d="M0 630 H1600"/><path d="M0 720 H1600"/>
    <path d="M0 830 H1600"/><path d="M0 960 H1600"/>
  </g>

  <!-- upper wireframe -->
  <g stroke="#1b1d22" stroke-opacity="0.1" stroke-width="1.1">
    <path d="M800 500 L-140 0"/><path d="M800 500 L420 0"/>
    <path d="M800 500 L800 0"/><path d="M800 500 L1180 0"/>
    <path d="M800 500 L1740 0"/>
  </g>

  <!-- reticle -->
  <g stroke="#b4724a" stroke-width="2.8" fill="none">
    <path d="M742 442 h-38 v-38"/><path d="M858 442 h38 v-38"/>
    <path d="M742 558 h-38 v38"/><path d="M858 558 h38 v38"/>
  </g>
  <circle cx="800" cy="500" r="7" fill="#b4724a"/>

  <g font-family="monospace" font-size="21" letter-spacing="3" fill="#5d6068">
    <text x="62" y="86">WORK 05 — HORIZON GRID</text>
    <text x="62" y="950">WORLD EXPERIENCE / SAMPLE PROJECT</text>
    <text x="1538" y="950" text-anchor="end">HORIZON LOCKED</text>
  </g>
</svg>
