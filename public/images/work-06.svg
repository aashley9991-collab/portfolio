<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Launch Frame sample artwork">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f6f0"/>
      <stop offset="1" stop-color="#e8e2d6"/>
    </linearGradient>
    <linearGradient id="bar6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f4ac7"/>
      <stop offset="1" stop-color="#b4724a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg6)"/>

  <!-- campaign frame -->
  <rect x="150" y="150" width="1300" height="700" fill="none" stroke="#1b1d22" stroke-opacity="0.26" stroke-width="2"/>
  <rect x="188" y="188" width="1224" height="624" fill="none" stroke="#2f4ac7" stroke-opacity="0.36" stroke-width="1.4" stroke-dasharray="7 11"/>

  <!-- typographic lockup -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="600">
    <text x="248" y="468" font-size="196" fill="#1b1d22" letter-spacing="-4">LAUNCH</text>
    <text x="248" y="650" font-size="196" fill="none" stroke="#2f4ac7" stroke-width="1.6" letter-spacing="-4">FRAME</text>
  </g>

  <!-- motion bars -->
  <rect x="248" y="712" width="400" height="10" fill="url(#bar6)"/>
  <rect x="672" y="712" width="170" height="10" fill="#1b1d22" fill-opacity="0.18"/>
  <rect x="866" y="712" width="86" height="10" fill="#1b1d22" fill-opacity="0.09"/>

  <!-- corner ticks -->
  <g stroke="#b4724a" stroke-width="3.4" fill="none">
    <path d="M150 226 v-76 h76"/><path d="M1450 226 v-76 h-76"/>
    <path d="M150 774 v76 h76"/><path d="M1450 774 v76 h-76"/>
  </g>

  <!-- side annotations -->
  <g font-family="monospace" font-size="20" letter-spacing="4" fill="#5d6068">
    <text x="1488" y="470" transform="rotate(90 1488 470)" text-anchor="middle">CAMPAIGN CONCEPT</text>
    <text x="112" y="500" transform="rotate(-90 112 500)" text-anchor="middle">TYPOGRAPHY · TIMING · REVEAL</text>
  </g>

  <circle cx="1382" cy="238" r="7" fill="#2f4ac7"/>
  <circle cx="1344" cy="238" r="7" fill="none" stroke="#b4724a" stroke-width="2"/>

  <g font-family="monospace" font-size="21" letter-spacing="3" fill="#5d6068">
    <text x="150" y="110">WORK 06 — LAUNCH FRAME</text>
    <text x="150" y="922">BRAND CAMPAIGN / SAMPLE PROJECT</text>
    <text x="1450" y="922" text-anchor="end">CONCEPT — NO CLIENT</text>
  </g>
</svg>
